<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thrift-Swap Board</title>
    <meta name="description" content="Students post items to swap and see how fair a trade is." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-row">
        <div>
          <h1>Thrift-Swap Board</h1>
          <p class="tagline">Post what you no longer need. Swap it for what you do.</p>
        </div>
        <ul class="service-status" aria-label="Service status">
          <li id="status-listings" class="pill pill-unknown" role="status">Listings: checking</li>
        </ul>
      </div>
    </header>

    <main class="wrap">
      <section aria-labelledby="board-title">
        <div class="section-head">
          <h2 id="board-title">Listings</h2>
          <div class="toolbar">
            <label for="filter-category">Category</label>
            <select id="filter-category">
              <option value="">All</option>
            </select>
            <label class="check"><input type="checkbox" id="filter-swapped" /> Show swapped</label>
            <button id="new-listing" class="btn btn-primary" type="button">Post a listing</button>
          </div>
        </div>
        <div id="listings-message" aria-live="polite"></div>
        <ul id="listings" class="cards"></ul>
      </section>
    </main>

    <dialog id="listing-dialog" aria-labelledby="listing-dialog-title">
      <form id="listing-form">
        <h2 id="listing-dialog-title">Post a listing</h2>
        <label>
          Title
          <input name="title" required maxlength="80" autocomplete="off" placeholder="Denim jacket, size M" />
        </label>
        <label>
          <span>Description <span class="hint">(optional)</span></span>
          <textarea name="description" maxlength="500" rows="3"></textarea>
        </label>
        <div class="row">
          <label>
            Category
            <select name="category" required></select>
          </label>
          <label>
            Condition
            <select name="condition" required></select>
          </label>
        </div>
        <div class="row">
          <label>
            Estimated value (€)
            <input name="estimated_value" type="number" required min="0.01" max="10000" step="0.01" inputmode="decimal" />
          </label>
          <label>
            Your name
            <input name="owner_name" required maxlength="40" autocomplete="given-name" />
          </label>
        </div>
        <p id="listing-form-error" class="form-error" role="alert"></p>
        <div class="dialog-actions">
          <button id="listing-cancel" class="btn" type="button">Cancel</button>
          <button id="listing-submit" class="btn btn-primary" type="submit">Post listing</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
