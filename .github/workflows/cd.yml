name: CD

# On every merge to main: run CI, push both images to GHCR tagged with the
# commit, roll both Container Apps to that tag (each service applies its own
# migrations when it starts), check /health on what was deployed, publish the
# UI, then run a smoke test against the public URLs.
#
# Run it by hand (Actions > CD > Run workflow, on main) with the full SHA of an
# older commit to roll back: the images for every merged commit stay in GHCR, and
# the UI is published from that same commit.
#
# The deploy jobs are skipped until the repository variable AZURE_RESOURCE_GROUP
# is set, so main stays green before Azure is set up. See docs/deploy.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full 40-character commit SHA already in GHCR to roll back to (leave empty to build this commit)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never stop a deploy halfway

env:
  REGISTRY: ghcr.io

jobs:
  check-input:
    name: check the rollback SHA
    if: inputs.image_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Only main deploys, and only a full commit SHA is a valid image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run this workflow on main, not on $GITHUB_REF" >&2
            exit 1
          fi
          if ! echo "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "image_tag must be the full 40-character commit SHA" >&2
            exit 1
          fi

  ci:
    if: inputs.image_tag == ''
    uses: ./.github/workflows/ci.yml

  images:
    name: push image (${{ matrix.service }})
    needs: ci
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [listings, swaps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name (GHCR needs lower case)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.service }}
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-services:
    name: deploy ${{ matrix.service }}
    needs: [images, check-input]
    # Runs after a fresh build, or directly on a manual rollback (images skipped).
    # Never from a branch other than main.
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && vars.AZURE_RESOURCE_GROUP != '' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - service: listings
            app: ${{ vars.LISTINGS_APP }}
          - service: swaps
            app: ${{ vars.SWAPS_APP }}
    steps:
      - name: Image to deploy
        env:
          # Passed through the environment, never pasted into the script text.
          WANTED_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          TAG="$WANTED_TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.service }}:$TAG" >> "$GITHUB_ENV"
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Roll the Container App to the new image
        run: |
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ matrix.app }}" \
            --image "$IMAGE" \
            --output none
      - name: /health answers 200 and reports the deployed commit
        run: |
          FQDN=$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ matrix.app }}" \
            --query properties.configuration.ingress.fqdn --output tsv)
          # The app scales to zero and its database auto-pauses, so the first
          # answer after a deploy can take a couple of minutes.
          for attempt in $(seq 1 40); do
            BODY=$(curl -fsS --max-time 20 "https://${FQDN}/health" || true)
            echo "attempt ${attempt}: ${BODY:-no answer yet}"
            if echo "$BODY" | grep -q "\"version\":\"${TAG}\""; then
              echo "deployed ${TAG} to https://${FQDN}"
              echo "https://${FQDN}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "the new revision of ${{ matrix.app }} never became healthy" >&2
          exit 1

  deploy-ui:
    name: deploy UI
    needs: deploy-services
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && vars.AZURE_RESOURCE_GROUP != '' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a rollback, publish the UI of the commit being rolled back to, not of HEAD.
          ref: ${{ inputs.image_tag || github.sha }}
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Point the UI at the deployed services
        run: |
          url() {
            az containerapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "$1" \
              --query properties.configuration.ingress.fqdn --output tsv
          }
          # Resolve both first: a failed lookup must stop the deploy, not publish
          # a page that points at "https://".
          LISTINGS_HOST=$(url "${{ vars.LISTINGS_APP }}")
          SWAPS_HOST=$(url "${{ vars.SWAPS_APP }}")
          test -n "$LISTINGS_HOST" && test -n "$SWAPS_HOST"
          cat > ui/config.js <<CONFIG
          // Written by the deploy pipeline. Local values are in the repository.
          window.THRIFT_CONFIG = {
            listingsUrl: "https://${LISTINGS_HOST}",
            swapsUrl: "https://${SWAPS_HOST}",
            timeoutMs: 8000,
            retryMs: 10000,
          };
          CONFIG
          cat ui/config.js
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ui
          skip_app_build: true
          skip_api_build: true

  smoke:
    name: smoke test the deployed system
    needs: deploy-ui
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && vars.AZURE_RESOURCE_GROUP != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Find the public URLs
        run: |
          host() {
            az containerapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "$1" \
              --query properties.configuration.ingress.fqdn --output tsv
          }
          LISTINGS_HOST=$(host "${{ vars.LISTINGS_APP }}")
          SWAPS_HOST=$(host "${{ vars.SWAPS_APP }}")
          UI_HOST=$(az staticwebapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.STATIC_APP }}" --query defaultHostname --output tsv)
          test -n "$LISTINGS_HOST" && test -n "$SWAPS_HOST" && test -n "$UI_HOST"
          {
            echo "LISTINGS_URL=https://${LISTINGS_HOST}"
            echo "SWAPS_URL=https://${SWAPS_HOST}"
            echo "UI_URL=https://${UI_HOST}"
          } >> "$GITHUB_ENV"
      # Read-only: it stores nothing in the production databases.
      - name: The live services and the live UI answer correctly
        run: python3 tests/e2e/flow.py deployed
