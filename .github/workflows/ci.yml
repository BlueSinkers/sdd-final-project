name: CI

# Runs on every push and every pull request: lint, format check, a security
# scan, tests against a real SQL Server with a coverage gate, image build, and
# end-to-end checks on the compose stack. CI never touches Azure. On main,
# cd.yml calls this workflow first and deploys only if it passes.
on:
  push:
    branches-ignore: [main] # pushes to main run through cd.yml, which calls this
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Known vulnerabilities in the pinned dependencies
        run: |
          pip-audit -r listings/requirements.txt
          pip-audit -r swaps/requirements.txt
      # B608 flags every SQL string built with an f-string. Ours only insert the
      # fixed column lists defined in repository.py; every value is a bound
      # parameter, and the tests cover it. All other checks stay on.
      - name: Static security scan of the service code
        run: bandit -r listings/app swaps/app --skip B608

  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [listings, swaps]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt -r ../requirements-dev.txt
      - name: Start a throwaway SQL Server for the tests
        run: |
          # A random password for each run, so no password is stored anywhere.
          SA_PASSWORD="Ci_$(openssl rand -hex 12)"
          echo "::add-mask::$SA_PASSWORD"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for attempt in $(seq 1 60); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa \
                 -P "$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready"; break
            fi
            sleep 2
          done
          echo "TEST_DATABASE_URL=mssql://sa:${SA_PASSWORD}@localhost:1433/${{ matrix.service }}_test" >> "$GITHUB_ENV"
      - name: Test with coverage (fails under 70%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  images:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [listings, swaps]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Build only. Pushing to a registry happens in the deploy pipeline on main.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  e2e:
    name: end-to-end on the compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Local passwords for this run only
        run: |
          for name in SA_PASSWORD LISTINGS_DB_PASSWORD SWAPS_DB_PASSWORD; do
            value="Ci_$(openssl rand -hex 12)"
            echo "::add-mask::$value"
            echo "$name=$value" >> .env
          done
      - run: docker compose up -d --build
      - name: Both services and the UI answer
        run: |
          for url in http://localhost:8001/health http://localhost:8002/health http://localhost:8080/; do
            for attempt in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then echo "up: $url"; continue 2; fi
              sleep 2
            done
            echo "$url did not answer" >&2
            exit 1
          done
      - name: Post two listings, propose a swap, accept it
        run: python3 tests/e2e/flow.py flow
      - name: Listings keeps working when Swaps is down
        run: |
          docker compose stop swaps
          python3 tests/e2e/flow.py swaps-down
          docker compose start swaps
      - name: Swaps keeps working when Listings is down
        run: |
          docker compose stop listings
          python3 tests/e2e/flow.py listings-down
      - name: Service logs
        if: always()
        run: docker compose logs listings swaps db-init
