name: CI

# Runs on every pull request and on pushes to main: lint, format check, image
# build, and a smoke test of the compose stack. CI never touches Azure.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  images:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [listings, swaps]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only. Pushing to a registry happens in the deploy pipeline on main.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  smoke:
    name: compose stack answers /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Both services return 200 on /health
        run: |
          for port in 8001 8002; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://localhost:${port}/health"; then echo; continue 2; fi
              sleep 2
            done
            echo "service on port ${port} did not become healthy" >&2
            exit 1
          done
      - name: Service logs
        if: always()
        run: docker compose logs
