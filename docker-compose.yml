# The whole system locally: cp .env.example .env, then docker compose up --build
# and open http://localhost:8080.
# The first start takes about a minute because SQL Server must be healthy before
# db-init and the services can start.
name: thrift-swap

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # no arm64 image: on Apple Silicon enable Rosetta in Docker Desktop
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?copy .env.example to .env}
    volumes:
      - sqldata:/var/opt/mssql # data survives docker compose down (but not down -v)
    ports:
      - "${SQL_PORT:-1433}:1433" # lets the tests run from the host (see README)
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-off job: creates the two databases and logins (idempotent), then exits.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      LISTINGS_DB_PASSWORD: ${LISTINGS_DB_PASSWORD:?copy .env.example to .env}
      SWAPS_DB_PASSWORD: ${SWAPS_DB_PASSWORD:?copy .env.example to .env}
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P "$$SA_PASSWORD" -i /init.sql -v LISTINGS_DB_PASSWORD="$$LISTINGS_DB_PASSWORD" SWAPS_DB_PASSWORD="$$SWAPS_DB_PASSWORD"

  listings:
    build: ./listings
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://listings_user:${LISTINGS_DB_PASSWORD}@sqlserver:1433/listings
      CORS_ORIGINS: http://localhost:${UI_PORT:-8080} # the browser origin of the UI below
      AUTH_SECRET: ${AUTH_SECRET} # signs sign-in tokens; Swaps gets the same value to check them
      DEMO_LOGIN: ${DEMO_LOGIN:-true} # one-click demo accounts, no password
    ports:
      - "${LISTINGS_PORT:-8001}:8000"

  swaps:
    build: ./swaps
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://swaps_user:${SWAPS_DB_PASSWORD}@sqlserver:1433/swaps
      CORS_ORIGINS: http://localhost:${UI_PORT:-8080}
      AUTH_SECRET: ${AUTH_SECRET}
    ports:
      - "${SWAPS_PORT:-8002}:8000"

  # Stock nginx with the folder mounted: static files, not a third service.
  # ui/config.js points the browser at localhost:8001 and localhost:8002.
  ui:
    image: nginx:1.27-alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "${UI_PORT:-8080}:80"

volumes:
  sqldata:
